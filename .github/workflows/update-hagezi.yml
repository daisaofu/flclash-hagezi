# Generated HaGeZi rule data is distributed under GPL-3.0.
# Rebuild with `python3 tools/build_hagezi.py`.
name: Update HaGeZi rule sets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build all Mihomo rule sets
        run: python3 tools/build_hagezi.py --tiers light pro.mini pro
      - name: Commit if changed
        run: |
          if git diff --quiet -- rulesets; then
            echo 'HaGeZi rules are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rulesets/*.txt
          git commit -m 'chore: update HaGeZi Mihomo rule sets'
          git push
